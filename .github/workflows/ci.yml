name: CI

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  # The weekly dependency PR is pushed with GITHUB_TOKEN, which starts no
  # `pull_request` run, so `deps-update.yml` starts this workflow on its branch.
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

# `cancel-in-progress` is PULL-REQUEST ONLY. On a PR a new push makes the
# running validation obsolete, so cancelling is free. On `master` it is not:
# every merge shares one group, so an unconditional `true` would let each merge
# kill the previous commit's validation before it could report — and a broken
# commit could then ride master with no run ever surviving long enough to fail.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TZ: UTC

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      # One command, same as local: each app's `lint` script checks its whole
      # directory and the root script adds `scripts/`. `biome check` covers
      # formatting, import organization and lint rules in one pass, so there is
      # no separate format job to duplicate it.
      - name: Run lint
        run: bun run lint
      - name: Check GitHub Action pins
        run: bun run check:action-versions
      - name: Check the TypeScript toolchain
        run: bun run check:typescript-toolchain

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: gitleaks reads the commits a pull request adds.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
      - name: Scan the tree with secretlint
        run: bun run secretlint
      # The open-source gitleaks CLI, so no licence key is needed. Pull
      # requests scan their own commits; every master commit arrived through a
      # scanned pull request.
      - name: Scan the pull request commits with gitleaks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_LINUX_X64_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git \
            --config .gitleaks.toml \
            --log-opts="${BASE_SHA}..HEAD" \
            --redact --verbose --no-banner --exit-code 1

  dead-code:
    name: Dead code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          generate-prisma: 'true'
      - name: Check for unused files, exports and dependencies
        run: bun run check:dead-code

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          generate-prisma: 'true'
      # `--continue` so one failing workspace does not mask the others. Without
      # it turbo SIGINTs the remaining tasks and a single broken app hides the
      # true state of the rest.
      - name: Run typecheck
        run: bunx turbo run typecheck --continue

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          generate-prisma: 'true'
      # apps/api compiles with tsc; apps/web is a Next.js build. Every
      # environment variable those two read has an inline fallback, so the
      # build needs no secrets.
      - name: Run build
        run: bunx turbo run build --continue

  test:
    name: Test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MARKETPLACE_DB_TEST_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          generate-prisma: 'true'
      # The database suites in apps/api (paid checkout, buyer-only downloads,
      # payment events) run here against the Postgres service above. They need
      # no Stripe credentials: the Stripe client is replaced in-process.
      - name: Run tests
        id: tests
        run: bun run test
      # Fails when apps/api/prisma/schema.prisma has a change no migration
      # carries, so an incompatible schema stops here and not at deploy.
      - name: Check migrations match the Prisma schema
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/migrations_check
        run: |
          psql postgresql://postgres@127.0.0.1:5432/postgres -c 'CREATE DATABASE migrations_check'
          bun run prisma:migrate
          bunx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

  e2e:
    name: Browser flow
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MARKETPLACE_DB_TEST_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          generate-prisma: 'true'
      - name: Build the API
        run: bunx turbo run build --filter=@marketplace/api
      # NEXT_PUBLIC_* is inlined at build time, so the web app is built with the
      # local API and the sign-in stand-in that apps/e2e starts.
      - name: Build the web app against the local stack
        env:
          NEXT_PUBLIC_MARKETPLACE_API_URL: http://127.0.0.1:3200
          NEXT_PUBLIC_GENFEED_APP_URL: http://127.0.0.1:3299
        run: bun run --cwd apps/web build
      - name: Install Chromium
        working-directory: apps/e2e
        run: bunx playwright install --with-deps chromium
      - name: Run the browser flow
        working-directory: apps/e2e
        run: bun run e2e

  api-image:
    name: API image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Build production API image
        run: docker build -f docker/Dockerfile.api -t marketplace-api:ci .
      - name: Verify database trust is readable by the runtime user
        run: docker run --rm marketplace-api:ci node -e "if (!require('node:tls').getCACertificates('extra').length) process.exit(1)"
      - name: Apply fixture schema and verify production startup
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          docker run --rm --network host -e DATABASE_URL marketplace-api:ci bun run prisma:migrate
          docker run --detach --name marketplace-api-ci --network host \
            -e DATABASE_URL -e STRIPE_SECRET_KEY=sk_test_disposable_fixture marketplace-api:ci
          trap 'docker logs marketplace-api-ci; docker rm -f marketplace-api-ci' EXIT
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:3200/health/ready
          curl --fail http://127.0.0.1:3200/marketplace/listings

      - name: Save the image verified by the production smoke test
        if: ${{ inputs.source_sha != '' }}
        run: |
          set -euo pipefail
          docker save marketplace-api:ci | zstd -T0 -3 -o /tmp/marketplace-api.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.source_sha != '' }}
        with:
          name: marketplace-api-${{ inputs.source_sha }}
          path: /tmp/marketplace-api.tar.zst
          compression-level: 0
          retention-days: 3
          overwrite: true

  deployment-checks:
    name: Deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify deployment task state handling
        run: python3 -m unittest discover -s scripts/deploy -p 'test_*.py' -v
      - name: Validate shell scripts
        run: shellcheck scripts/deploy/*.sh
      - name: Validate GitHub workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4
        with:
          tofu_version: '1.12.2'
      - name: Validate isolated Marketplace infrastructure
        working-directory: infra/production
        run: |
          tofu fmt -check
          tofu init -backend=false -input=false
          tofu validate

  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Tests include real database isolation and gate release readiness.
    needs: [lint, typecheck, build, test, e2e, api-image, deployment-checks]
    if: always()
    steps:
      - name: Verify gating jobs succeeded
        run: |
          RESULTS="${{ needs.lint.result }} ${{ needs.typecheck.result }} ${{ needs.build.result }} ${{ needs.test.result }} ${{ needs.e2e.result }} ${{ needs.api-image.result }} ${{ needs.deployment-checks.result }}"
          echo "lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }} build=${{ needs.build.result }} test=${{ needs.test.result }} e2e=${{ needs.e2e.result }}"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed."
              exit 1
            fi
          done
          echo "✅ All gating jobs passed." >> "$GITHUB_STEP_SUMMARY"
