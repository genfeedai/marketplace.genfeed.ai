# Weekly `bun run deps:update:packages`. This repository does not use
# Dependabot, so package bumps honor the ncu rejects (typescript,
# @typescript/native) and wait out the 3 hour release cooldown.
#
# It runs on the built-in GITHUB_TOKEN only. No personal token or extra secret
# is needed.
#
# Two jobs, so package install scripts never run next to a write token:
#   update   no token, read-only: runs ncu and `bun install`, and hands over a
#            patch limited to package manifests and the lockfile.
#   publish  token, fresh checkout, no install: checks the patch touches only
#            those files, applies it, pushes, and opens or refreshes the PR.
#
# Two limits of GITHUB_TOKEN shape the rest:
#   - A pull request it opens or pushes to starts no `pull_request` run, so the
#     publish job starts CI on the branch itself (`workflow_dispatch`).
#   - It can never push a change under `.github/workflows`, so GitHub Action
#     pins are not part of the weekly PR. Bump them from a normal branch with
#     `bun run deps:update:actions`.
name: Update Dependencies

on:
  workflow_dispatch:
  schedule:
    # Weekly, Tuesday 6am UTC
    - cron: '0 6 * * 2'

concurrency:
  group: deps-update
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: UTC

jobs:
  update:
    name: Update packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Bun environment
        uses: ./.github/actions/setup-bun-env
        with:
          install-command: "bun install"

      - name: Update packages
        run: bun run deps:update:packages

      - name: Write the package patch
        run: git diff --binary -- package.json 'apps/*/package.json' bun.lock > deps.patch

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deps-patch
          path: deps.patch
          if-no-files-found: error

  publish:
    name: Open or refresh the weekly PR
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Outside the workspace, so nothing in the artifact can replace a file
      # this job runs. Only `deps.patch` is read, below.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deps-patch
          path: ${{ runner.temp }}/deps-patch

      # No `bun install` and no `bun run` here: this job holds the push token,
      # so it runs no package script. The patched package.json is data only.
      - name: Apply the package patch
        env:
          PATCH: ${{ runner.temp }}/deps-patch/deps.patch
        run: |
          set -euo pipefail
          if [[ -s "$PATCH" ]]; then
            git apply --numstat "$PATCH" | awk '{ print $3 }' | while read -r path; do
              if [[ ! "$path" =~ ^(package\.json|apps/[^/]+/package\.json|bun\.lock)$ ]]; then
                echo "::error::The package patch touches $path, which is not a manifest or the lockfile."
                exit 1
              fi
            done
            git apply "$PATCH"
          fi

      - name: Open or refresh the weekly PR
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No dependency updates."
            exit 0
          fi

          branch="chore/deps-update"
          head_owner="${GITHUB_REPOSITORY%%/*}"
          list_weekly_pull_requests() {
            gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/pulls" \
              --raw-field state=open \
              --raw-field base=master \
              --raw-field head="${head_owner}:${branch}" \
              --raw-field per_page=2 \
              --jq '.[].number'
          }
          pull_request_numbers="$(list_weekly_pull_requests)"
          pull_requests=()
          if [[ -n "$pull_request_numbers" ]]; then
            mapfile -t pull_requests <<< "$pull_request_numbers"
          fi
          if (( ${#pull_requests[@]} > 1 )); then
            echo "::error::Expected at most one open weekly dependency PR, found ${#pull_requests[@]}. Close duplicates before retrying."
            exit 1
          fi

          previous_sha="$(
            git ls-remote --heads origin "refs/heads/${branch}" \
              | awk 'NR == 1 { print $1 }'
          )"
          if [[ -n "$previous_sha" ]]; then
            git fetch --no-tags origin "$previous_sha"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore(deps): weekly deps:update"
          update_sha="$(git rev-parse HEAD)"
          git push \
            --force-with-lease="refs/heads/${branch}:${previous_sha}" \
            origin \
            "HEAD:refs/heads/${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          if (( ${#pull_requests[@]} == 1 )); then
            echo "Refreshed weekly dependency PR #${pull_requests[0]}."
            exit 0
          fi

          if gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base master \
            --head "$branch" \
            --title "chore(deps): weekly deps:update" \
            --body "$(cat <<'EOF'
          Single weekly bump from `bun run deps:update`: npm-check-updates with a 3 hour release cooldown and the repo rejects (`typescript`, `@typescript/native`), and a lockfile install. GitHub Action pins are bumped separately with `bun run deps:update:actions`.
          EOF
          )"; then
            exit 0
          fi

          echo "::error::GitHub Actions could not create the weekly dependency PR. Enable Settings → Actions → General → Allow GitHub Actions to create and approve pull requests, then retry this workflow."
          if ! pull_request_numbers="$(list_weekly_pull_requests)"; then
            echo "::error::Could not verify whether GitHub created the PR after the CLI error; preserving ${branch} at ${update_sha} to avoid detaching a potentially-created PR."
            exit 1
          fi
          if [[ -n "$pull_request_numbers" ]]; then
            echo "Weekly dependency PR #${pull_request_numbers%%$'\n'*} became visible after the CLI error."
            exit 0
          fi

          if [[ -n "$previous_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/${branch}:${update_sha}" \
              origin \
              "${previous_sha}:refs/heads/${branch}"
          else
            git push \
              --force-with-lease="refs/heads/${branch}:${update_sha}" \
              origin \
              ":refs/heads/${branch}"
          fi
          exit 1

      # GITHUB_TOKEN pushed the branch, so no `pull_request` run started.
      # `workflow_dispatch` is the one event it may start, and a run on the
      # branch reports its checks on the PR's head commit.
      - name: Start CI on the weekly PR
        if: ${{ steps.publish.outputs.branch != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
