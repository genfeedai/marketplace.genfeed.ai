name: Deploy Marketplace web
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DOMAIN: ${{ vars.DOMAIN }}
      BUILD_ID: ${{ inputs.source_sha }}
    steps:
      - name: Require Marketplace production identity
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
          test -n "$DOMAIN"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-env
      - name: Install pinned Vercel CLI
        run: bun add --global vercel@65.16.0
      - name: Pull only the Marketplace project
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Configure public application origins
        run: |
          set -euo pipefail
          env_file=.vercel/.env.production.local
          awk '!/^(NEXT_PUBLIC_GENFEED_API_URL|NEXT_PUBLIC_MARKETPLACE_API_URL|NEXT_PUBLIC_GENFEED_APP_URL)=/' "$env_file" > "$env_file.tmp"
          {
            printf 'NEXT_PUBLIC_GENFEED_API_URL=https://api.%s\n' "$DOMAIN"
            printf 'NEXT_PUBLIC_MARKETPLACE_API_URL=https://api.shop.%s\n' "$DOMAIN"
            printf 'NEXT_PUBLIC_GENFEED_APP_URL=https://app.%s\n' "$DOMAIN"
          } >> "$env_file.tmp"
          mv "$env_file.tmp" "$env_file"
      - name: Build approved Marketplace source
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Point the Vercel project at the shop address
        run: |
          set -euo pipefail
          domain="shop.$DOMAIN"
          api=https://api.vercel.com
          auth="Authorization: Bearer $VERCEL_TOKEN"
          out=/tmp/vercel.json
          status="$(curl -sS -H "$auth" -o "$out" -w '%{http_code}' \
            "$api/v9/projects/$VERCEL_PROJECT_ID/domains/$domain?teamId=$VERCEL_ORG_ID")"
          if [[ "$status" == 404 ]]; then
            status="$(curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$domain\"}" -o "$out" -w '%{http_code}' \
              "$api/v10/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID")"
          fi
          [[ "$status" == 200 ]] || { cat "$out"; exit 1; }
          jq '{name, verified, verification}' "$out"
          jq -e '.verified' "$out" > /dev/null
          curl -sS --fail-with-body -H "$auth" \
            "$api/v6/domains/$domain/config?teamId=$VERCEL_ORG_ID&projectIdOrName=$VERCEL_PROJECT_ID" |
            jq '{configuredBy, misconfigured, recommendedCNAME}'
          status="$(curl -sS -X PATCH -H "$auth" -H 'Content-Type: application/json' \
            -d "{\"name\":\"$domain\"}" -o "$out" -w '%{http_code}' \
            "$api/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          [[ "$status" == 200 ]] || { jq '.error' "$out"; exit 1; }
          jq '{name, repository: .link.repo}' "$out"
      - name: Deploy Marketplace
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Verify production pages and live catalog
        run: |
          set -euo pipefail
          curl --fail --retry 6 --retry-all-errors --retry-delay 10 "https://shop.$DOMAIN"
          curl --fail "https://shop.$DOMAIN/prompts" -o /tmp/marketplace-prompts.html
          if grep -q 'Catalog unavailable' /tmp/marketplace-prompts.html; then
            echo '::error::The deployed frontend could not reach its catalog'
            exit 1
          fi
          curl --fail "https://api.shop.$DOMAIN/marketplace/listings?limit=1" | jq -e '.data | type == "array"'
      - name: Remove the old web address
        run: |
          set -euo pipefail
          out=/tmp/vercel.json
          status="$(curl -sS -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" -o "$out" -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains/marketplace.$DOMAIN?teamId=$VERCEL_ORG_ID")"
          [[ "$status" == 200 || "$status" == 404 ]] || { cat "$out"; exit 1; }
