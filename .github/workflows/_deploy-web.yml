name: Deploy Marketplace web
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DOMAIN: ${{ vars.DOMAIN }}
      BUILD_ID: ${{ inputs.source_sha }}
    steps:
      - name: Require Marketplace production identity
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
          test -n "$DOMAIN"
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-env
      - name: Install pinned Vercel CLI
        run: bun add --global vercel@54.4.1
      - name: Pull only the Marketplace project
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Configure public application origins
        run: |
          set -euo pipefail
          env_file=.vercel/.env.production.local
          awk '!/^(NEXT_PUBLIC_GENFEED_API_URL|NEXT_PUBLIC_MARKETPLACE_API_URL|NEXT_PUBLIC_GENFEED_APP_URL)=/' "$env_file" > "$env_file.tmp"
          {
            printf 'NEXT_PUBLIC_GENFEED_API_URL=https://api.%s\n' "$DOMAIN"
            printf 'NEXT_PUBLIC_MARKETPLACE_API_URL=https://api.marketplace.%s\n' "$DOMAIN"
            printf 'NEXT_PUBLIC_GENFEED_APP_URL=https://app.%s\n' "$DOMAIN"
          } >> "$env_file.tmp"
          mv "$env_file.tmp" "$env_file"
      - name: Build approved Marketplace source
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy Marketplace
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Verify production pages and live catalog
        run: |
          set -euo pipefail
          curl --fail --retry 6 --retry-all-errors --retry-delay 10 "https://marketplace.$DOMAIN"
          curl --fail "https://marketplace.$DOMAIN/prompts" -o /tmp/marketplace-prompts.html
          if grep -q 'Catalog unavailable' /tmp/marketplace-prompts.html; then
            echo '::error::The deployed frontend could not reach its catalog'
            exit 1
          fi
          curl --fail "https://api.marketplace.$DOMAIN/marketplace/listings?limit=1" | jq -e '.data | type == "array"'
