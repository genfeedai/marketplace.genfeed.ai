name: Setup Bun Environment
description: Standardize Node, Bun, dependency install and cache setup for CI jobs.

inputs:
  node-version:
    description: |
      Node.js version to install. Tracks Active LTS: 24.x entered LTS on
      2025-10-28 and stays there until 2026-10-20, whereas 22.x dropped to
      maintenance on 2025-10-21 and now receives security fixes only. Nothing
      here compiles against a Node 23+ API — the bump is about staying on a
      line that still gets bug fixes.
    required: false
    default: '24.x'
  install-command:
    description: Dependency install command to run after toolchain setup
    required: false
    default: 'bun install --frozen-lockfile'
  generate-prisma:
    description: |
      Run `prisma generate` when apps/api carries a Prisma schema. Jobs that
      compile or execute API sources need the generated client on disk; lint
      does not. The step is a no-op when no schema is present.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ inputs.node-version }}

    # Read the version from the root `packageManager` pin rather than repeating
    # it here. setup-bun parses that field directly
    # (`pkg.packageManager?.split("bun@")?.[1]`), so package.json is the single
    # source of truth: bumping Bun is a one-line change and CI cannot silently
    # drift from what developers run locally.
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json

    - name: Cache bun modules
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Cache Turbo
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ hashFiles('turbo.json', '**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    # Retry with backoff against registry/CDN transients. `bun install` is
    # idempotent, so a re-run only re-attempts what is still missing.
    - name: Install dependencies
      shell: bash
      env:
        MAX_ATTEMPTS: '3'
      run: |
        for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
          echo "::group::install attempt ${attempt}/${MAX_ATTEMPTS}: ${{ inputs.install-command }}"
          if ${{ inputs.install-command }}; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
          if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
            backoff=$((10 * 2 ** (attempt - 1)))
            echo "::warning::install attempt ${attempt}/${MAX_ATTEMPTS} failed; retrying in ${backoff}s"
            sleep "${backoff}"
          fi
        done
        echo "::error::install failed after ${MAX_ATTEMPTS} attempts"
        exit 1

    # Guarded on the schema existing so this action also works on refs that
    # predate the Prisma migration. Run through the workspace script to use the
    # repo-pinned Prisma CLI instead of resolving the latest version via bunx.
    - name: Generate Prisma client
      if: ${{ inputs.generate-prisma == 'true' }}
      shell: bash
      run: |
        if [ -f apps/api/prisma/schema.prisma ]; then
          bun run --cwd apps/api prisma:generate
        else
          echo "No apps/api/prisma/schema.prisma on this ref — skipping prisma generate."
        fi
